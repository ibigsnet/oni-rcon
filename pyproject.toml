[project]
name = "oni-rcon"
dynamic = ["version"]
description = "An ONI-themed terminal admin console for Project Reclaimer (Halo 3) dedicated servers, over RCON."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ibigs, LLC" }]
requires-python = ">=3.11"
dependencies = ["textual>=8.0", "websockets>=15"]
keywords = ["halo", "reclaimer", "rcon", "tui", "textual", "server-admin"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]

[project.scripts]
oni-rcon = "oni_rcon.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/oni_rcon/__init__.py"
