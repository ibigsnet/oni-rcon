<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Automation Studio</title>
<style>
:root{--ink:#0d0f12;--surface:#12151a;--panel:#171b21;--panel-2:#1d222a;--line:#2a313b;--amber:#ffb000;--cyan:#38d6e8;--red:#ff5d5d;--green:#4ade80;--warn:#f5b942;--white:#e6ebf0;--grey:#9aa4b0;--dim:#66707c;
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,ui-monospace,monospace;--side:230px;--bottom:230px;--gw:48px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--ink);color:var(--white);font:12px/1.5 var(--mono);overflow:hidden;user-select:none}
button{font:inherit;color:inherit;background:none;border:1px solid transparent;border-radius:3px;padding:2px 8px;cursor:pointer;letter-spacing:.04em}
button:hover{background:var(--panel-2);border-color:var(--line)}
button:disabled{opacity:.4;cursor:default;background:none;border-color:transparent}
button.pri{color:var(--ink);background:var(--amber);border-color:var(--amber);font-weight:700}
button.danger{color:var(--red)}
input,select,textarea{font:inherit;color:var(--white);background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:3px 6px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--amber)}
select{padding:2px 4px}
.grow{flex:1}
.dim{color:var(--dim)}.grey{color:var(--grey)}.ok{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--warn)}.amber{color:var(--amber)}.cyan{color:var(--cyan)}
#bar{display:flex;align-items:center;gap:4px;height:34px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;white-space:nowrap;overflow:hidden}
#bar .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
#bar .title{color:var(--amber);font-weight:700;letter-spacing:.12em;margin-right:8px}
#run{color:var(--green)}#test{color:var(--cyan)}#stop{color:var(--red)}
#main{flex:1;display:flex;min-height:0}
#side{width:var(--side);min-width:150px;max-width:50vw;display:flex;flex-direction:column;background:var(--panel);flex:none;min-height:0}
.hd{display:flex;align-items:center;gap:6px;padding:6px 10px 4px;color:var(--grey);font-size:11px;letter-spacing:.12em;flex:none}
.hd button{padding:0 6px}
#files{overflow:auto;flex:1 1 55%;min-height:60px}
.file{display:flex;align-items:center;gap:6px;padding:2px 8px 2px 10px;cursor:pointer;white-space:nowrap}
.file:hover{background:var(--panel-2)}
.file.on{background:color-mix(in srgb,var(--amber) 12%,transparent)}
.file .nm{overflow:hidden;text-overflow:ellipsis;flex:1}
.light{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.light.running{background:var(--green);box-shadow:0 0 6px var(--green)}
.light.starting{background:var(--amber)}
.light.failed{background:var(--red);box-shadow:0 0 6px var(--red)}
.light.finished{background:var(--grey)}
.dot{color:var(--amber)}
.tb{font-size:10px;color:var(--ink);background:var(--cyan);border-radius:2px;padding:0 3px;line-height:14px}
.acts{display:none;gap:1px}.file:hover .acts{display:flex}
.acts button{padding:0 3px;border:0;color:var(--grey)}
.acts button:hover{color:var(--white)}
.sw{width:30px;height:14px;border-radius:7px;background:var(--line);position:relative;flex:none;border:0;padding:0}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--grey);transition:left .12s}
.sw:hover{background:var(--dim)}
.sw.on{background:color-mix(in srgb,var(--green) 55%,var(--line))}
.sw.on::after{left:18px;background:var(--white)}
#outline{overflow:auto;flex:1 1 45%;min-height:40px}
.sym{padding:1px 10px 1px 16px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sym:hover{background:var(--panel-2)}
.sym i{font-style:normal;color:var(--cyan);margin-right:6px}
.sym .dim{margin-left:6px}
#dir{padding:4px 10px;font-size:10px;color:var(--dim);border-top:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none;user-select:text}
.split{flex:none;background:var(--line);touch-action:none}
#sp-side{width:3px;cursor:col-resize}
#sp-bottom{height:3px;cursor:row-resize}
.split:hover,.split.drag{background:var(--amber)}
#work{flex:1;display:flex;flex-direction:column;min-width:0}
#center{flex:1;display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;background:var(--panel);overflow-x:auto;overflow-y:hidden;flex:none;height:30px;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:4px;padding:0 4px 0 12px;border-right:1px solid var(--line);color:var(--grey);cursor:pointer;white-space:nowrap;border-top:2px solid transparent;flex:none}
.tab.on{background:var(--ink);color:var(--white);border-top-color:var(--amber)}
.tab .x{padding:0 4px;border:0;visibility:hidden;color:var(--grey)}
.tab:hover .x,.tab.on .x{visibility:visible}
.tab .light{width:6px;height:6px}
#banner{display:flex;gap:8px;align-items:center;padding:4px 10px;background:color-mix(in srgb,var(--warn) 16%,var(--panel));border-bottom:1px solid var(--line);flex:none}
#ed{position:relative;flex:1;display:flex;min-height:0;background:var(--ink)}
#gut{width:var(--gw);flex:none;position:relative;overflow:hidden;border-right:1px solid var(--line)}
#gutin{position:absolute;left:0;right:0;top:0}
.ln{position:absolute;right:10px;left:14px;height:20px;line-height:20px;color:var(--dim);font-size:12px;text-align:right}
.ln.cur{color:var(--white)}
.mk{position:absolute;left:5px;width:7px;height:7px;border-radius:50%;margin-top:7px}
.mk.e{background:var(--red)}.mk.w{background:var(--warn)}
#sc{position:relative;flex:1;overflow:auto;min-width:0}
#sizer{position:relative}
.code{font:13px/20px var(--mono);font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0;tab-size:2;white-space:pre;letter-spacing:0}
#hl,#deco,#sq{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none}
#hl>div{position:absolute;left:8px;height:20px}
#ta{position:absolute;left:0;top:0;margin:0;border:0;border-radius:0;padding:4px 8px;resize:none;overflow:hidden;background:transparent;color:transparent;caret-color:var(--amber);outline:0;z-index:2;user-select:text}
#ta::selection{background:color-mix(in srgb,var(--cyan) 28%,transparent);color:transparent}
.cl{position:absolute;left:0;right:0;height:20px;background:color-mix(in srgb,var(--white) 4%,transparent)}
.fm{position:absolute;height:20px;background:color-mix(in srgb,var(--amber) 22%,transparent);border-radius:2px}
.fm.on{background:color-mix(in srgb,var(--amber) 42%,transparent);outline:1px solid var(--amber)}
.bm{position:absolute;height:20px;outline:1px solid var(--grey);border-radius:2px}
.sq{position:absolute;color:transparent;text-decoration:underline wavy var(--red);text-decoration-skip-ink:none;text-underline-offset:3px}
.sq.w{text-decoration-color:var(--warn)}
.kw{color:var(--amber)}.str{color:var(--green)}.tpl{color:color-mix(in srgb,var(--green) 70%,var(--cyan))}.num,.con{color:var(--warn)}
.com{color:var(--dim);font-style:italic}.re{color:var(--red)}.api{color:var(--cyan);font-weight:600}.fn{color:color-mix(in srgb,var(--cyan) 50%,var(--white))}
.prop{color:color-mix(in srgb,var(--white) 78%,var(--grey))}.op,.br{color:var(--grey)}.pun{color:var(--dim)}.id{color:var(--white)}
#find{position:absolute;top:6px;right:18px;z-index:5;display:flex;flex-direction:column;gap:4px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:0 6px 18px #0008}
#find .fr{display:flex;gap:4px;align-items:center}
#find input{width:220px}
#find .tg.on{color:var(--amber);border-color:var(--amber)}
#fcount{min-width:76px;color:var(--grey);font-size:11px;text-align:center}
#find.bad #fq{border-color:var(--red)}
#ac{position:absolute;z-index:6;width:460px;max-height:250px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:0 8px 22px #000a;overflow:hidden}
#aclist{overflow:auto;flex:1}
.ai{display:flex;gap:8px;align-items:center;padding:1px 8px;white-space:nowrap;cursor:pointer}
.ai.on{background:color-mix(in srgb,var(--amber) 22%,transparent)}
.ai .ic{width:16px;text-align:center;font-size:11px;flex:none;color:var(--cyan)}
.ai .lb{overflow:hidden;text-overflow:ellipsis}
.ai .lb b{color:var(--amber)}
.ai .dt{margin-left:auto;color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;padding-left:12px}
#acdoc{border-top:1px solid var(--line);padding:4px 8px;color:var(--grey);font-size:11px;white-space:normal;max-height:84px;overflow:auto}
#acdoc:empty{display:none}
#sig,#tip{position:absolute;z-index:6;max-width:540px;padding:4px 8px;background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:0 6px 18px #0009;white-space:pre-wrap;font-size:12px;pointer-events:none}
#sig b{color:var(--amber)}#sig .d{display:block;color:var(--grey);font-size:11px;margin-top:2px}
#tip .e{color:var(--red)}#tip .w{color:var(--warn)}#tip code,#sig code{color:var(--cyan)}#tip hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#welcome{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--grey);background:var(--ink);z-index:4;padding:20px;text-align:center}
#welcome h1{margin:0;color:var(--amber);letter-spacing:.24em;font-size:18px}
#welcome .keys{display:grid;grid-template-columns:auto auto;gap:3px 16px;font-size:11px;text-align:left}
kbd{font:inherit;color:var(--white);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--panel);white-space:nowrap}
#measure{position:absolute;visibility:hidden;left:-99999px;top:0}
#bottom{height:var(--bottom);min-height:90px;max-height:80vh;display:flex;flex-direction:column;background:var(--panel);flex:none}
#btabs{display:flex;align-items:center;gap:2px;padding:0 6px;border-bottom:1px solid var(--line);flex:none;height:28px;overflow:hidden}
#btabs>button{border:0;border-bottom:2px solid transparent;border-radius:0;padding:4px 10px;color:var(--grey);font-size:11px;letter-spacing:.1em;white-space:nowrap}
#btabs>button.on{color:var(--white);border-bottom-color:var(--amber)}
.badge{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--red);color:var(--ink);font-size:10px;line-height:15px;text-align:center;margin-left:6px;letter-spacing:0}
.badge:empty{display:none}
.badge.w{background:var(--warn)}
#panels{flex:1;min-height:0;position:relative}
#panels>section{position:absolute;inset:0;display:flex;flex-direction:column}
.tools{display:flex;align-items:center;gap:6px;padding:4px 8px;flex:none;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}
.tools input[type=search],.tools input.q{width:180px}
.list{flex:1;overflow:auto;user-select:text;padding:2px 0}
.row{display:flex;gap:8px;padding:0 10px;white-space:pre-wrap;word-break:break-word}
.row:hover{background:var(--panel-2)}
.row .t{color:var(--dim);flex:none}
.row .s{color:var(--cyan);flex:none;cursor:pointer}
.row .m{flex:1;min-width:0}
.row .loc{color:var(--dim);text-decoration:underline;cursor:pointer;flex:none}
.row .loc:hover{color:var(--white)}
.row.error .m{color:var(--red)}.row.warn .m{color:var(--warn)}.row.rcon .m{color:var(--grey)}.row.sys .m{color:var(--dim)}.row.info .m{color:var(--white)}
.row .tag{font-size:10px;color:var(--ink);background:var(--cyan);border-radius:2px;padding:0 3px;flex:none;align-self:center;line-height:14px}
.row .k{color:var(--amber);flex:none;min-width:96px}
.row .srv{color:var(--cyan);flex:none}
.row button{padding:0 6px;font-size:10px;color:var(--grey)}
.row .btns{display:none;gap:2px;flex:none}.row:hover .btns{display:flex}
pre.json{margin:2px 10px 6px 30px;color:var(--grey);font:inherit;white-space:pre-wrap;user-select:text}
.prob{cursor:pointer}
.prob .ic{flex:none}
.empty{padding:10px 14px;color:var(--dim)}
#p-simulate textarea,#p-store textarea{flex:1;margin:6px 8px 8px;resize:none;font:12px/1.5 var(--mono);user-select:text}
#rlog .row .m{color:var(--white)}
#rin{margin:4px 8px 8px;flex:none}
.doc{padding:4px 14px 14px;user-select:text}
.doc h3{color:var(--amber);font-size:11px;letter-spacing:.14em;margin:12px 0 4px;font-weight:700}
.doc .it{margin:2px 0 6px}.doc .it>div{color:var(--grey);padding-left:16px}
.doc code{color:var(--cyan)}
.doc table{border-collapse:collapse}.doc td{padding:1px 12px 1px 0;vertical-align:top;color:var(--grey)}.doc td:first-child{color:var(--white);white-space:nowrap}
#status{display:flex;align-items:center;gap:14px;height:22px;padding:0 10px;background:var(--panel-2);border-top:1px solid var(--line);color:var(--grey);font-size:11px;flex:none;white-space:nowrap;overflow:hidden}
#status .it{cursor:pointer}
#overlay{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-start;justify-content:center;padding-top:10vh;z-index:20}
.modal{width:min(580px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 16px 40px #000c;display:flex;flex-direction:column;max-height:80vh}
.modal h2{margin:0;padding:10px 14px;font-size:12px;letter-spacing:.14em;color:var(--amber);border-bottom:1px solid var(--line)}
.modal .body{padding:12px 14px;overflow:auto;display:flex;flex-direction:column;gap:8px;color:var(--grey);white-space:pre-wrap}
.modal .body input{width:100%}
.modal .err{color:var(--red);min-height:1.5em}
.modal .btns{display:flex;justify-content:flex-end;gap:6px;padding:10px 14px;border-top:1px solid var(--line)}
.tpls{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow:auto;white-space:normal}
.tpli{padding:4px 8px;border-radius:3px;cursor:pointer;border:1px solid transparent}
.tpli:hover{background:var(--panel-2)}
.tpli.on{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 10%,transparent)}
.tpli b{color:var(--white);font-weight:600}.tpli span{display:block;color:var(--dim);font-size:11px}
#qp{position:fixed;top:40px;left:50%;transform:translateX(-50%);width:min(640px,92vw);z-index:21;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 16px 40px #000c;display:flex;flex-direction:column;max-height:64vh}
#qp input{margin:8px;border-color:var(--amber)}
#qplist{overflow:auto;padding-bottom:6px}
.qi{display:flex;gap:10px;padding:3px 12px;cursor:pointer;white-space:nowrap}
.qi.on{background:color-mix(in srgb,var(--amber) 22%,transparent)}
.qi .dt{margin-left:auto;color:var(--dim);overflow:hidden;text-overflow:ellipsis}
.qi b{color:var(--amber)}
#toast{position:fixed;right:14px;bottom:30px;z-index:30;max-width:440px;padding:8px 12px;background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:4px;box-shadow:0 8px 22px #000a;white-space:pre-wrap}
#toast.bad{border-left-color:var(--red)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-corner{background:transparent}
</style>
</head>
<body>
<div id="bar">
  <span class="title">&#9670; STUDIO</span>
  <button id="run" title="Save, turn on and (re)start this script (Ctrl+Enter)">&#9654; RUN</button>
  <button id="test" title="Run the editor's text as a dry run: commands that change anything are only logged (Ctrl+Shift+Enter)">&#9879; TEST</button>
  <button id="stop" title="Stop this script's test and turn it off">&#9632; STOP</button>
  <button id="restart" title="Restart this script">&#8635; RESTART</button>
  <span class="sep"></span>
  <button id="save" title="Save (Ctrl+S)">SAVE</button>
  <button id="new" title="New script (Ctrl+N)">+ NEW</button>
  <span class="sep"></span>
  <button id="findb" title="Find (Ctrl+F), replace (Ctrl+H)">FIND</button>
  <button id="cmds" title="Commands (Ctrl+Shift+P)">&#8984; COMMANDS</button>
  <span class="grow"></span>
  <span id="runinfo" class="grey"></span>
</div>
<div id="main">
  <aside id="side">
    <div class="hd">SCRIPTS <span id="nfiles" class="dim"></span><span class="grow"></span><button id="side-new" title="New script (Ctrl+N)">+</button></div>
    <div id="files"></div>
    <div class="hd" style="border-top:1px solid var(--line)">OUTLINE</div>
    <div id="outline"></div>
    <div id="dir"></div>
  </aside>
  <div id="sp-side" class="split"></div>
  <div id="work">
    <div id="center">
      <div id="tabs"></div>
      <div id="banner" hidden></div>
      <div id="ed">
        <div id="gut"><div id="gutin"></div></div>
        <div id="sc"><div id="sizer"><div id="deco"></div><div id="hl" class="code"></div><div id="sq" class="code"></div><textarea id="ta" class="code" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Script editor"></textarea></div></div>
        <div id="find" hidden>
          <div class="fr"><input id="fq" placeholder="Find" spellcheck="false"><button id="fcase" class="tg" title="Match case">Aa</button><button id="fre" class="tg" title="Regular expression">.*</button><span id="fcount"></span><button id="fprev" title="Previous (Shift+Enter)">&#8593;</button><button id="fnext" title="Next (Enter)">&#8595;</button><button id="fx" title="Close (Escape)">&#10005;</button></div>
          <div class="fr" id="frow"><input id="fr" placeholder="Replace" spellcheck="false"><button id="fone" title="Replace this match">Replace</button><button id="fall" title="Replace every match">All</button></div>
        </div>
        <div id="ac" hidden><div id="aclist"></div><div id="acdoc"></div></div>
        <div id="sig" hidden></div>
        <div id="tip" hidden></div>
        <div id="welcome" hidden>
          <h1>AUTOMATION STUDIO</h1>
          <div>Small JavaScript automations that watch your servers and act on them.</div>
          <div><button class="pri" id="w-new">+ NEW SCRIPT</button> <button id="w-open">OPEN&#8230;</button> <button id="w-docs">DOCS</button></div>
          <div class="keys" id="w-keys"></div>
        </div>
        <span id="measure" class="code"></span>
      </div>
    </div>
    <div id="sp-bottom" class="split"></div>
    <div id="bottom">
      <div id="btabs">
        <button data-p="console">CONSOLE<span id="b-console" class="badge"></span></button>
        <button data-p="problems">PROBLEMS<span id="b-problems" class="badge"></span></button>
        <button data-p="events">EVENTS<span id="b-events" class="badge w"></span></button>
        <button data-p="simulate">SIMULATE</button>
        <button data-p="rcon">RCON</button>
        <button data-p="store">STORE</button>
        <button data-p="docs">DOCS</button>
        <span class="grow"></span>
        <button id="bhide" title="Hide the panel (Ctrl+J)">&#9662;</button>
      </div>
      <div id="panels">
        <section id="p-console">
          <div class="tools">
            <select id="cf-script" title="Script"></select>
            <select id="cf-level" title="Level"><option value="">all levels</option><option value="error">errors</option><option value="warn">warnings and errors</option><option value="rcon">RCON</option><option value="log">logs</option></select>
            <input id="cf-text" class="q" placeholder="Filter" spellcheck="false">
            <span class="grow"></span>
            <span id="c-count" class="dim"></span>
            <button id="c-clear" title="Clear the console">CLEAR</button>
          </div>
          <div id="clog" class="list"></div>
        </section>
        <section id="p-problems"><div id="plist" class="list"></div></section>
        <section id="p-events">
          <div class="tools">
            <select id="ef-kind"></select>
            <input id="ef-text" class="q" placeholder="Filter" spellcheck="false">
            <button id="e-pause" title="Stop showing new events">PAUSE</button>
            <span id="e-new" class="dim"></span>
            <span class="grow"></span>
            <button id="e-clear">CLEAR</button>
          </div>
          <div id="elist" class="list"></div>
        </section>
        <section id="p-simulate">
          <div class="tools">
            <select id="s-kind" title="Event kind"></select>
            <select id="s-server" title="Server"></select>
            <button id="s-sample" title="Put this kind's example back">EXAMPLE</button>
            <span class="grow"></span>
            <button id="s-test" title="Send it to the TEST run of the open script">SEND TO TEST</button>
            <button id="s-live" class="danger" title="Send it to every running script: they act on it for real">SEND TO LIVE&#8230;</button>
          </div>
          <textarea id="s-json" spellcheck="false"></textarea>
        </section>
        <section id="p-rcon">
          <div class="tools"><select id="r-server" title="Server"></select><span class="dim">Commands go through the same permissions as a script's. Up and Down for history.</span></div>
          <div id="rlog" class="list"></div>
          <input id="rin" placeholder="players" spellcheck="false">
        </section>
        <section id="p-store">
          <div class="tools">
            <select id="st-script" title="Script"></select>
            <button id="st-reload">RELOAD</button>
            <button id="st-save">SAVE</button>
            <button id="st-clear" class="danger">CLEAR&#8230;</button>
            <span id="st-info" class="dim"></span>
          </div>
          <textarea id="st-json" spellcheck="false"></textarea>
        </section>

    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    el.classList.add("drag");
    const move = (ev) => at(ev), up = () => {

    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
  });
}

  return new Promise((res) => {
    const inp = o.querySelector("input"), err = o.querySelector(".err");
    let sel = 0;
    const done = (v) => {
      o.hidden = true;
      o.innerHTML = "";
      o.onclick = o.ondblclick = o.onkeydown = null;
      back?.focus?.({ preventScroll: true });
      res(v);
    };
    const finish = () => {
      const v = inp ? inp.value.trim() : "", why = check && inp ? check(v) : "";
      if (why) { err.textContent = why; return inp.focus(); }
      done(pick ? { value: v, pick: sel } : inp ? v : true);
    };
    const choose = (i) => {
      sel = clamp(i, 0, pick.length - 1);
      o.querySelectorAll(".tpli").forEach((el, j) => el.classList.toggle("on", j === sel));
      o.querySelectorAll(".tpli")[sel].scrollIntoView({ block: "nearest" });
    };
    if (inp && err) inp.oninput = () => (err.textContent = "");
    o.onclick = (e) => {
      const t = e.target.closest(".tpli"), a = e.target.closest("button")?.dataset.a;
      if (t) return choose(+t.dataset.i);
      if (a === "ok") finish();
      else if (a === "alt") done(false);
      else if (a === "cancel") done(null);
    };
    o.ondblclick = (e) => e.target.closest(".tpli") && finish();
    o.onkeydown = (e) => {
      e.stopPropagation(); // not the editor's keys, nor the page's
      if (e.key === "Escape") { e.preventDefault(); done(null); }
      else if (e.key === "Enter" && e.target.tagName !== "BUTTON") { e.preventDefault(); finish(); }
      else if (pick && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); choose(sel + (e.key === "ArrowDown" ? 1 : -1)); }
      else if (e.key === "Tab") { // focus stays in the dialog
        const f = [...o.querySelectorAll("input, button")], i = f.indexOf(document.activeElement);
        e.preventDefault();
        f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
      } else if (/^F([1-9]|1[0-2])$/.test(e.key)) e.preventDefault();
    };
    if (inp) { inp.focus(); inp.select(); }
    else o.querySelector(danger ? "[data-a=cancel]" : "[data-a=ok]").focus();
  });
}

// --- the quick pick: scripts, >commands, @symbols, :line ---------------------------------------------------------
const qpEl = $("qp"), qpin = $("qpin"), qplist = $("qplist");
const qp = { items: [], idx: 0, back: null };
const need = (f) => () => (cur ? f() : toast("Open a script first.", true));
const COMMANDS = [
  ["Run script", "Ctrl+Enter", need(() => runScript())],
  ["Test script (dry run)", "Ctrl+Shift+Enter", need(startTest)],
  ["Stop script", "", need(() => stopScript())],
  ["Restart script", "", need(() => restartScript())],
  ["Stop every script", "", stopAll],
  ["Save", "Ctrl+S", need(() => save())],
  ["Save all", "Ctrl+Shift+S", saveAll],
  ["New script", "Ctrl+N", newScript],
  ["Open script", "Ctrl+P", () => openQuick("")],
  ["Rename script", "", need(() => renameScript(cur.name))],
  ["Duplicate script", "", need(() => duplicate(cur.name))],
  ["Delete script", "", need(() => deleteScript(cur.name))],
  ["Close tab", "Ctrl+W", need(() => closeTab(cur))],
  ["Close all tabs", "", async () => { for (const m of tabs.slice()) { await closeTab(m); if (tabs.includes(m)) return; } }],
  ["Find", "Ctrl+F", need(() => openFind(false))],
  ["Replace", "Ctrl+H", need(() => openFind(true))],
  ["Go to line", "Ctrl+G", () => openQuick(":")],
  ["Go to symbol", "Ctrl+Shift+O", () => openQuick("@")],
  ["Toggle comment", "Ctrl+/", need(toggleComment)],
  ["Show or hide the panel", "Ctrl+J", togglePanel],
  ["Console", "Ctrl+`", () => showPanel("console")],
  ["Problems", "Ctrl+Shift+M", () => showPanel("problems")],
  ["Events", "", () => showPanel("events")],
  ["Simulate an event", "", () => showPanel("simulate")],
  ["RCON console", "", () => showPanel("rcon")],
  ["Script store", "", () => showPanel("store")],
  ["Docs", "", () => showPanel("docs")],
  ["Clear the console", "", () => $("c-clear").click()],
  ["Reload the script list", "", () => refreshList().then(() => toast(`${files.size} scripts.`), (e) => toast(e.message, true))],
];
function openQuick(prefix) {
  if (!$("overlay").hidden) return;
  closePopups();
  if (qpEl.hidden) qp.back = document.activeElement;
  qpEl.hidden = false;
  qpin.value = prefix;
  qp.idx = 0;
  drawQuick();
  qpin.focus();
  qpin.setSelectionRange(prefix.length, prefix.length);
}
function closeQuick() {
  if (qpEl.hidden) return;
  qpEl.hidden = true;
  if (qp.back && qp.back !== qpin && document.contains(qp.back)) qp.back.focus({ preventScroll: true });
  else if (cur) ta.focus({ preventScroll: true });
  qp.back = null;
}
function drawQuick() {
  const v = qpin.value, mode = /^[>@:]/.test(v) ? v[0] : "", q = v.slice(mode ? 1 : 0).trim();
  let items;
  if (mode === ">") items = COMMANDS.map(([label, dt, run]) => ({ label, dt, run }));
  else if (mode === "@") items = cur ? cur.syms.map((s) => ({ label: s.name, dt: "line " + (s.l + 1), run: () => goTo(s.l) })) : [];
  else if (mode === ":") {
    const x = /^(\d+)(?:[:,](\d+))?$/.exec(q);
    items = !cur ? [] : [x ? { label: `Go to line ${x[1]}${x[2] ? ", column " + x[2] : ""}`, run: () => goTo(+x[1] - 1, x[2] ? +x[2] - 1 : undefined) }
      : { label: `A line number, 1 to ${cur.lines.length}`, dt: "and :column if you like" }];
  } else items = [...files.keys()].sort().map((n) => {
    const r = runs.get(n);
    return { label: n, dt: r ? r.state : files.get(n).on ? "on" : "", pri: tabs.some((t) => t.name === n) ? 0 : 1, run: () => openScript(n) };
  });
  qp.items = mode === ":" ? items : rank(items, q);
  qp.idx = clamp(qp.idx, 0, Math.max(0, qp.items.length - 1));
  qplist.innerHTML = qp.items.length ? qp.items.map((it, i) => `<div class="qi${i === qp.idx ? " on" : ""}" data-i="${i}"><span>${
    mode === ":" ? esc(it.label) : hilite(it.label, q)}</span><span class="dt">${esc(it.dt || "")}</span></div>`).join("")
    : `<div class="empty">${mode === "@" ? (cur ? "No symbols." : "Open a script first.") : mode === ":" ? "Open a script first." : mode === ">" ? "No such command." : files.size ? "No script matches." : "No scripts yet: Ctrl+N makes one."}</div>`;
  qplist.querySelector(".qi.on")?.scrollIntoView({ block: "nearest" });
}
function runQuick(i) {
  const it = qp.items[i];
  if (!it?.run) return;
  closeQuick();
  it.run();
}
qpin.oninput = () => { qp.idx = 0; drawQuick(); };
qpin.onkeydown = (e) => {
  e.stopPropagation();
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    const n = qp.items.length;
    if (n) { qp.idx = (qp.idx + (e.key === "ArrowDown" ? 1 : -1) + n) % n; drawQuick(); }
  } else if (e.key === "Enter") { e.preventDefault(); runQuick(qp.idx); }
  else if (e.key === "Escape" || e.key === "Tab") { e.preventDefault(); closeQuick(); }
  else if (/^F([1-9]|1[0-2])$/.test(e.key)) { e.preventDefault(); closeQuick(); toParent({ oni: "key", key: e.key }); }
};
qpin.onblur = () => setTimeout(() => document.activeElement !== qpin && closeQuick());
qplist.onmousedown = (e) => e.preventDefault(); // keep the input focused
qplist.onclick = (e) => {
  const r = e.target.closest(".qi");
  if (r) runQuick(+r.dataset.i);
};

// --- the page's keys, and its buttons ----------------------------------------------------------------------------
const KEYMAP = {
  "Ctrl+S": () => save(), "Ctrl+Shift+S": saveAll, "Ctrl+Enter": need(() => runScript()), "Ctrl+Shift+Enter": need(startTest),
  "Ctrl+P": () => openQuick(""), "Ctrl+Shift+P": () => openQuick(">"), "Ctrl+Shift+O": () => openQuick("@"), "Ctrl+G": () => openQuick(":"),
  "Ctrl+F": need(() => openFind(false)), "Ctrl+H": need(() => openFind(true)), "Ctrl+J": togglePanel, "Ctrl+`": () => showPanel("console"),
  "Ctrl+Shift+M": () => showPanel("problems"), "Ctrl+N": newScript, "Ctrl+W": () => closeTab(cur), "Ctrl+Tab": () => cycleTab(1), "Ctrl+Shift+Tab": () => cycleTab(-1),
  "Ctrl+R": () => {}, "Ctrl+Shift+R": () => {}, // a reload would stop every script
};
document.addEventListener("keydown", (e) => {
  if (!$("overlay").hidden || e.isComposing) return;
  if (/^F([1-9]|1[0-2])$/.test(e.key)) { // Oni's own keys (F5 would reload the frame)
    e.preventDefault();
    if (!e.ctrlKey && !e.altKey && !e.metaKey && !e.shiftKey) toParent({ oni: "key", key: e.key });
    return;
  }
  const f = KEYMAP[keyName(e)];
  if (!f) return;
  e.preventDefault();
  f();
});
$("run").onclick = () => runScript();
$("test").onclick = need(startTest);
$("stop").onclick = () => stopScript();
$("restart").onclick = () => restartScript();
$("save").onclick = () => save();
$("new").onclick = $("side-new").onclick = $("w-new").onclick = () => newScript();
$("findb").onclick = need(() => openFind(false));
$("cmds").onclick = () => openQuick(">");
$("w-open").onclick = () => openQuick("");
$("w-docs").onclick = () => showPanel("docs");
$("w-keys").innerHTML = KEYS.slice(0, 12).map(([k, d]) => `<span>${k.split(" / ").map((x) => `<kbd>${esc(x)}</kbd>`).join(" / ")}</span><span>${esc(d)}</span>`).join("");
addEventListener("pagehide", () => { for (const r of runs.values()) r.flush(); }); // Oni closing: what the stores hold, saved

// --- Oni → page ----------------------------------------------------------------------------------------------------
let serversKey = "";
addEventListener("message", (e) => {
  const m = e.data;
  if (e.source !== parent || !m || typeof m !== "object") return;
  if (m.oni === "data") {
    const redactWas = S.redact;
    S.redact = !!m.redact;
    S.server = String(m.server ?? "");
    if (m.data && m.data.dir) S.dir = String(m.data.dir);
    const sv = Array.isArray(m.servers) ? m.servers.map((s) => ({ name: String(s.name), online: !!s.online })) : [];
    if (JSON.stringify(sv) !== serversKey) {
      serversKey = JSON.stringify(sv);
      S.servers = sv;
      for (const r of [...runs.values(), ...(test ? [test] : [])]) r.send({ t: "servers", servers: sv });
      fillServers();
      tabs.forEach(lintSoon); // "no server called …"
    }
    for (const [k, v] of Object.entries(m.theme || {})) if (v) rootStyle.setProperty("--" + k, String(v));
    $("dir").textContent = mask(S.dir);
    if (S.redact !== redactWas) {
      drawLog(true);
      drawEvents(true);
      drawOutline();
      drawProblems();
      if (panelShown("store")) loadStore();
    }
    drawFiles();
    drawStatus();
    if (!S.booted) { S.booted = true; boot(); }
  } else if (m.oni === "event") {
    if (!m.ev || typeof m.ev !== "object") return;
    eventIn(String(m.server ?? ""), m.ev);
    deliver(String(m.server ?? ""), m.ev);
  } else if (m.oni === "rcon-reply") {
    const f = m.id != null && rconWait.get(m.id); // a reply with no id (or `replies`) is someone else's
    if (f) { rconWait.delete(m.id); f(m); }
  } else if (m.oni === "reply") {
    const w = waiting.get(m.ref);
    if (!w) return;
    waiting.delete(m.ref);
    clearTimeout(w.t);
    if (!m.ok) w.rej(new Error(String(m.error || "failed")));
    else if (m.data && m.data.error) w.rej(new Error(String(m.data.error))); // studio.rs refused it
    else w.res(m.data ?? {});
  }
});

const loadHooks = () => call({ op: "hooks" }).then((h) => {
  const was = JSON.stringify(S.hooks);
  S.hooks = { discord: h.discord ?? [], telegram: h.telegram ?? [] };
  S.hooksLoaded = true;
  if (JSON.stringify(S.hooks) !== was) tabs.forEach(lintSoon);
}, () => {});
/** The first data from Oni: list the scripts, and start the ones turned on. */
async function boot() {
  measure();
  document.fonts?.ready.then(() => { measure(); layout(); schedule(); });
  showPanel("console");
  drawLog(true);
  drawEvents(true);
  drawProblems();
  drawTabs();
  drawStatus();
  let list;
  for (let i = 0; !list; i++) {
    try { list = await refreshList(); }
    catch (e) {
      if (i === 0) logLine({ at: Date.now(), script: "", level: "error", text: `Couldn't list the scripts (trying again every 5 s): ${e.message}` });
      await new Promise((r) => setTimeout(r, 5000));
    }
  }
  loadHooks();
  setInterval(loadHooks, 60000);
  setInterval(poll, 5000);
  setInterval(() => cur && (runs.has(cur.name) || test) && drawRunInfo(), 1000);
  const on = list.scripts.filter((x) => x.on);
  logLine({ at: Date.now(), script: "", level: "sys", text: `Studio ready: ${list.scripts.length} scripts, ${on.length} turned on.` });
  for (const x of on) startLive(x.name, x.code);
}

toParent({ oni: "ready" });
</script>
